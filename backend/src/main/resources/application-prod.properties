# 生产环境配置（Render + PostgreSQL）。
# 本地开发默认不激活此文件，仍用 application.properties 里的 H2。
# Render 上通过 SPRING_PROFILES_ACTIVE=prod 激活。

server.port=${PORT:8080}

# PostgreSQL：连接信息由 render.yaml 的 fromDatabase 自动注入到 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 自动建表 + 方言
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# 生产环境不执行 data.sql（示例数据由首启动的 DataSeeder 灌入）
spring.sql.init.mode=never

# 生产环境关闭 H2 控制台
spring.h2.console.enabled=false

# 上传大小限制（与本地一致）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 上传目录（注意：Render 文件系统是临时的，生产环境建议接入对象存储）
file.upload-dir=uploads

# JWT 密钥来自环境变量 JWT_SECRET（务必 >= 32 字符，否则签名失败）
app.jwt.secret=${JWT_SECRET:FRUITBLOG_DEFAULT_DEV_SECRET_KEY_PLEASE_CHANGE_IT_32PLUS_CHARS}
app.jwt.expiration=86400000
