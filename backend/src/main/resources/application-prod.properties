# 生产环境配置（Render + PostgreSQL）。
# 本地开发默认不激活此文件，仍用 application.properties 里的 H2。
# Render 上通过 SPRING_PROFILES_ACTIVE=prod 激活。

server.port=${PORT:8080}

# PostgreSQL：连接信息由 render.yaml 的 fromDatabase 自动注入到 DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 自动建表 + 方言
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 生产环境不执行 data.sql，避免每次重启重复插入示例数据
spring.sql.init.mode=never

# 上传大小限制（与本地一致）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB