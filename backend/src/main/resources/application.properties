server.port=8080

# 文件型 H2 数据库（持久化，重启不丢数据，存到项目下的 data/ 目录）
spring.datasource.url=jdbc:h2:file:./data/fruitblog;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# 自动建表（根据实体生成表结构）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# 关闭启动时执行 data.sql：示例数据改由 DataSeeder 程序化灌入，更可控
spring.sql.init.mode=never

# 上传目录（相对于项目运行目录）
file.upload-dir=uploads

# 上传文件大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT 配置（开发用固定密钥；生产请在 application-prod.properties 用环境变量覆盖）
app.jwt.secret=FRUITBLOG_DEFAULT_DEV_SECRET_KEY_PLEASE_CHANGE_IT_32PLUS_CHARS
app.jwt.expiration=86400000
