name: Deploy static site to GitHub Pages

# 什么时候触发这个工作流？
# 1) 往 main 分支 push 代码时自动跑
# 2) 也可以在 GitHub 仓库的 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署到 GitHub Pages 需要下面三个权限，缺一不可
permissions:
  contents: read     # 读取仓库代码
  pages: write       # 往 Pages 写内容
  id-token: write    # 用来做 OIDC 身份验证

# 避免同时有多个 Pages 部署互相打架
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------- 第 1 个 Job：构建 ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      # ===== 前端：构建成静态文件（这就是“静态网站”本身）=====
      - name: 2. 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. 安装前端依赖
        working-directory: frontend
        run: npm ci || npm install

      - name: 4. 构建前端
        working-directory: frontend
        # VITE_API_BASE 决定前端去哪里找后端接口：
        # - 本地开发/同一域名下由 Spring Boot 托管时留空（用相对路径 /api）
        # - 若把后端部署到别的服务器，改成它的地址，例如 https://api.example.com
        run: npm run build
        # 后端地址从仓库变量读取：GitHub 仓库 → Settings → Secrets and variables →
        # Actions → Variables 里新建 VITE_API_BASE，值填后端地址（例如 https://xxx.onrender.com，结尾不要斜杠）
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # ===== 后端：打包成可执行 JAR（作为产物，方便你部署完整应用）=====
      - name: 5. 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 6. 打包 Spring Boot 后端
        working-directory: backend
        run: mvn -B package -DskipTests

      - name: 7. 把后端 JAR 存为可下载产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      # ===== 把前端静态文件交给 Pages 部署步骤 =====
      - name: 8. 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist   # Vite 构建输出目录

  # ---------- 第 2 个 Job：部署 ----------
  deploy:
    needs: build            # 必须等 build 成功
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
